name: Sync to Public Repos

on:
  push:
    branches:
      - main
    paths:
      - 'apps/nias-desktop-client/**'
      - 'apps/nias-shared/**'
  workflow_dispatch:

jobs:
  sync-desktop-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install git-filter-repo
        run: |
          pip install git-filter-repo

      - name: Filter and push to public repo
        env:
          PUBLIC_REPO_URL: https://x-access-token:${{ secrets.SYNC_PUBLIC_REPO_TOKEN }}@github.com/immanuelalfredo-bhp/nias-desktop-client.git
        run: |
          mkdir -p /tmp/sync-repo-desktop
          cd /tmp/sync-repo-desktop
          
          git clone --mirror https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/immanuelalfredo-bhp/nias.git nias.git
          cd nias.git
          
          git filter-repo --subdirectory-filter apps/nias-desktop-client --force
          
          git push --mirror "$PUBLIC_REPO_URL"
