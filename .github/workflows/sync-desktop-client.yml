name: Sync to Public Repos

on:
  push:
    branches:
      - main
    paths:
      - 'apps/nias-desktop-client/**'
  workflow_dispatch:

jobs:
  sync-desktop-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install git-filter-repo
        run: |
          pip install git-filter-repo

      - name: Filter and push code & tags to public repo
        env:
          PUBLIC_REPO_URL: https://x-access-token:${{ secrets.SYNC_PUBLIC_REPO_TOKEN }}@github.com/immanuelalfredo-bhp/nias-desktop-client.git
        run: |
          mkdir -p /tmp/sync-repo-desktop
          cd /tmp/sync-repo-desktop
          
          git clone --mirror https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/immanuelalfredo-bhp/nias.git nias.git
          cd nias.git
          
          # Filter history down to just the desktop client app
          git filter-repo --subdirectory-filter apps/nias-desktop-client --force
          
          # Push the main branch code first
          git remote add public "$PUBLIC_REPO_URL"
          git push public main:main --force

          # --- FIX: Create a working tree so we can read package.json ---
          mkdir -p /tmp/working-client
          git --work-tree=/tmp/working-client checkout main -- .
          cd /tmp/working-client

          # Extract version from package.json
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "Detected version: $VERSION -> Tag will be: $TAG"

          # Check if this tag already exists on the public repo
          if git ls-remote --tags "$PUBLIC_REPO_URL" | grep -q "refs/tags/$TAG"; then
            echo "Tag $TAG already exists on public repo. Skipping tag creation."
          else
            echo "Creating and pushing new tag $TAG..."
            # Configure a temporary git repo context in the working dir to tag & push
            git init
            git remote add public "$PUBLIC_REPO_URL"
            git add package.json
            git commit -m "chore: release $TAG" || true
            git tag "$TAG"
            git push public "$TAG" --force
          fi
