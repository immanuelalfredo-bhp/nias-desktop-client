name: Sync to Public Repos

on:
  push:
    branches:
      - main
    paths:
      - 'apps/nias-desktop-client/**'
  workflow_dispatch:

jobs:
  sync-desktop-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout public repo (write access)
        uses: actions/checkout@v4
        with:
          repository: immanuelalfredo-bhp/nias-desktop-client
          token: ${{ secrets.SYNC_PUBLIC_REPO_TOKEN }}
          path: public
          fetch-depth: 0

      - name: Configure git for public repo
        run: |
          cd public
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync files from private subdir into public repo
        run: |
          # copy content from private repo subdir to the checked-out public repo
          rsync -a --delete --exclude='.git' apps/nias-desktop-client/ public/

      - name: Commit & push changes to public repo if any
        run: |
          cd public
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(sync): update nias-desktop-client from private repo"
            git push origin main
          else
            echo "No changes to sync"
          fi

      - name: Create tag from package.json version (only if missing)
        env:
          PUBLIC_REPO_URL: https://x-access-token:${{ secrets.SYNC_PUBLIC_REPO_TOKEN }}@github.com/immanuelalfredo-bhp/nias-desktop-client.git
        run: |
          # Read version from the private-repo package.json
          VERSION=$(python -c "import json,sys;print(json.load(open('apps/nias-desktop-client/package.json'))['version'])")
          TAG="v$VERSION"
          echo "Detected version: $VERSION -> Tag will be: $TAG"

          # Check if the tag already exists on the public repo
          if git ls-remote --tags "$PUBLIC_REPO_URL" | grep -q "refs/tags/$TAG"; then
            echo "Tag $TAG already exists on public repo. Skipping tag creation."
          else
            echo "Creating annotated tag $TAG and pushing to public repo..."
            cd public
            git tag -a "$TAG" -m "release $TAG"
            git push origin "$TAG"
          fi
